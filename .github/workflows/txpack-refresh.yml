name: txpack refresh (lock-bump PR prototype)

# Prototype of the routine pack-refresh flow. In the full design the candidate pack comes from
# a gated recording run against the canonical terminology server; this prototype takes it as an
# input so the downstream machinery (canonical compare -> machine-rendered diff -> AI-written
# explanation -> lock-bump PR) can be exercised without a server in CI.
#
# Review model: the pack artifact itself never lands in git (immutable, hash-named, in the pack
# store). The ONLY thing that changes in git is fhir.lock, so the review gate is this PR. Merge
# policy is a dial on the machine-generated facts (auto-merge additions-only; human review for
# changed answers) - never on the AI prose, which is explanation, not evidence.

# Trigger: chained off the recorder via workflow_run (GITHUB_TOKEN-safe — no PAT, no triggering
# push) when a nightly delta survives reproduce-before-propose; the candidate (url + sha256)
# arrives as the record run's `refresh-request` artifact. Also manually runnable with explicit
# candidate inputs (e.g. to exercise the diff -> impact -> explanation -> PR machinery on demand).
on:
  workflow_run:
    workflows: ["txpack record (nightly refresh — recorder half)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_url:
        description: "URL of the candidate pack zip"
        required: true
      candidate_sha256:
        description: "sha256 (hex) of the candidate pack zip"
        required: true

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  compare-and-propose:
    runs-on: ubuntu-latest
    # only proceed when triggered manually, or by a record run that actually SUCCEEDED
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve candidate (record-run artifact, or dispatch inputs)
        id: req
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            cand_url='${{ inputs.candidate_url }}'; cand_sha='${{ inputs.candidate_sha256 }}'
          else
            # the triggering record run attaches a refresh-request artifact ONLY when it proposed a
            # confirmed delta; absent it, this was a no-delta night - exit quietly.
            if ! gh run download "${{ github.event.workflow_run.id }}" --repo "$GITHUB_REPOSITORY" --name refresh-request --dir req 2>/dev/null; then
              echo "no refresh-request artifact on the triggering run - nothing proposed; done."
              echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            cand_url=$(jq -r .candidate_url req/refresh-request.json)
            cand_sha=$(jq -r .candidate_sha256 req/refresh-request.json)
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "cand_url=$cand_url" >> "$GITHUB_OUTPUT"; echo "cand_sha=$cand_sha" >> "$GITHUB_OUTPUT"
          cur_url=$(jq -r '.packages[] | select(.contentSha256) | .resolved' fhir.lock)
          cur_int=$(jq -r '.packages[] | select(.contentSha256) | .integrity' fhir.lock)
          cur_sha=$(echo "$cur_int" | sed 's/^sha256-//' | base64 -d | xxd -p -c64)
          curl -fsSL -o current.zip "$cur_url";    echo "$cur_sha  current.zip"   | sha256sum -c -
          curl -fsSL -o candidate.zip "$cand_url"; echo "$cand_sha  candidate.zip" | sha256sum -c -
      - uses: actions/setup-java@v4
        if: steps.req.outputs.proceed == 'true'
        with: { distribution: temurin, java-version: "17" }
      - name: Fetch tooling jar (from kindling-wrapper.properties)
        if: steps.req.outputs.proceed == 'true'
        run: |
          url=$(grep '^toolUrl=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          sha=$(grep '^toolSha256=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          curl -fsSL -o tool.jar "$url"; echo "$sha  tool.jar" | sha256sum -c -
      - name: Canonical compare (Java packager diff)
        id: diff
        if: steps.req.outputs.proceed == 'true'
        run: |
          set +e
          java -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild diff-packs current.zip candidate.zip > pack-diff.md
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "No semantic change - keeping the current pack; nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 3 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            exit $rc
          fi
          cat pack-diff.md
      # layer 1: what does this bump actually do to the published spec? Same-machine A/B:
      # build with the current pack, build with the candidate, diff content-level output.
      # Hermetic both times - a candidate that DROPS needed answers fails loudly right here.
      - name: Cache FHIR package cache
        if: steps.diff.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-v1
      - name: Output A/B (current pack, then candidate)
        if: steps.diff.outputs.changed == 'true'
        run: |
          java -Xmx11g -Dorg.hl7.fhir.tx.pack="$PWD/current.zip" -cp tool.jar \
            org.hl7.fhir.tools.publisher.SpecBuild build . --manifest
          cp build-future.manifest /tmp/old-output.manifest
          rm -f build-future.manifest
          SIGNATURE_GATE=report java -Xmx11g -Dorg.hl7.fhir.tx.pack="$PWD/candidate.zip" -cp tool.jar \
            org.hl7.fhir.tools.publisher.SpecBuild build . --manifest
          CAND_SIG=$(grep -E "Summary: Errors=" build-future.log | tail -1 | sed 's/.*Summary: //')
          CUR_SIG=$(jq -r '.expectedOutput | "Errors=\(.errors), Warnings=\(.warnings), Information messages=\(.information)"' fhir.lock)
          { echo "## Published-output impact (same-machine A/B, content-level)";
            echo;
            echo "**Output signature with candidate: $CAND_SIG** (current pack: $CUR_SIG)";
            echo;
            java -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild impact /tmp/old-output.manifest build-future.manifest | sed 's/^/- /' > /tmp/impact-list.txt
            n=$(wc -l < /tmp/impact-list.txt)
            if [ "$n" -eq 0 ]; then echo "**No published file changes** - this bump is output-inert."; else
              echo "**$n published file(s) change with this bump:**"; echo; cat /tmp/impact-list.txt; fi; } > output-impact.md
          cat output-impact.md
      - name: "Explanation section (GitHub Models - narrative only, no tools, no authority)"
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat pack-diff.md output-impact.md > /tmp/explain-input.md 2>/dev/null || cp pack-diff.md /tmp/explain-input.md
          jq -n --rawfile diff /tmp/explain-input.md '{
            model: "openai/gpt-4o-mini",
            messages: [
              {role: "system", content: "You explain terminology answer-pack diffs for FHIR spec build reviewers. Use ONLY facts present in the supplied diff. Group related changes, state the likely kind of cause (new spec content vs server-side curation), and say plainly what a reviewer should look at. 3 short paragraphs max. Do not invent counts or claims."},
              {role: "user", content: $diff}
            ]
          }' > req.json
          curl -fsS https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d @req.json | jq -r '.choices[0].message.content' > explanation.md \
            || echo "_(explanation service unavailable; machine diff above is authoritative)_" > explanation.md
      - name: Open lock-bump PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha_content=$(basename "${{ steps.req.outputs.cand_url }}" .zip | sed 's/^txpack-//')
          ssri="sha256-$(echo "${{ steps.req.outputs.cand_sha }}" | xxd -r -p | base64)"
          name=$(jq -r '.packages | to_entries[] | select(.key | endswith(".txpack")) | .key' fhir.lock)
          jq --arg n "$name" --arg url "${{ steps.req.outputs.cand_url }}" --arg int "$ssri" \
             '.packages[$n].resolved=$url | .packages[$n].integrity=$int' fhir.lock > fhir.lock.new && mv fhir.lock.new fhir.lock
          branch="txpack-bump-$(date +%Y%m%d-%H%M)"
          git checkout -b "$branch"
          git -c user.name=txpack-refresh -c user.email=noreply@github.com commit -am "Bump fhir.lock to candidate pack"
          git push origin "$branch"
          { echo "Machine-verified canonical diff (authoritative):"; echo; cat pack-diff.md; echo;
            cat output-impact.md 2>/dev/null || true; echo;
            echo "## Explanation (AI-generated from the diffs above - narrative only)"; echo; cat explanation.md; } > body.md
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "txpack refresh: $(grep -m1 'changed' pack-diff.md || echo 'answer updates')" \
            --body-file body.md
