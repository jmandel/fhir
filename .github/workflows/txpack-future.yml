name: txpack future world

on:
  push:
    branches: [txpack-future]
  workflow_dispatch:
    inputs:
      parity:
        description: "Run the full reproducibility job (double build + evidence-judged parity)"
        type: boolean
        default: true
      stock_baseline:
        description: "Also run the stock-toolchain cold baseline against tx.fhir.org (slow; be polite - run rarely)"
        type: boolean
        default: false

jobs:
  # the required, every-push gate: ONE hermetic cold build (~4 min). Zero terminology network,
  # enforced; output signature checked. This is the everyday CI cost of the future world.
  future-hermetic:
    name: "Future: hermetic cold build (zero terminology network)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-v1
      - name: Cache content-addressed tooling + pack
        uses: actions/cache@v4
        with:
          path: |
            ~/.fhir/tx-packs
            ~/.fhir/tools
          key: fhirlock-${{ hashFiles('fhir.lock', 'tools/build/kindling-wrapper.properties') }}
      - name: Hermetic cold build + signature check
        run: HEAP=11g ./tools/build/build.sh
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: build-future-log, path: build-future.log }

  # the OPTIONAL reproducibility track: double build + evidence-judged byte parity against the
  # committed reference. Runs when the pinned world itself changes (fhir.lock, the wrapper pin, the verification
  # tooling, the reference) or on demand - not on every content push (it costs 2x build time,
  # and intended content changes would rightly differ from the reference anyway)
  reproducibility:
    name: "Reproducibility: converged build vs committed reference"
    runs-on: ubuntu-latest
    # NON-BLOCKING: this is the optional stretch track (same commit -> same bytes on ANY
    # machine). Cross-environment byte-reproducibility is a research goal - we've pinned seven
    # stock-toolchain leak classes (locale, path, username, fonts, fs-order, ordering, designation
    # flicker) and the committed reference is environment-sensitive beyond them. The hermetic gate
    # above is the real check; this job runs for signal, not as a merge blocker.
    continue-on-error: true
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.parity) ||
      (github.event_name == 'push' && contains(join(github.event.commits.*.message, ' '), '[parity]'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-v1
      - name: Cache content-addressed tooling + pack
        uses: actions/cache@v4
        with:
          path: |
            ~/.fhir/tx-packs
            ~/.fhir/tools
          key: fhirlock-${{ hashFiles('fhir.lock', 'tools/build/kindling-wrapper.properties') }}
      # two builds: the first supplies convergence (first-build-vs-converged is a documented
      # stock difference) AND the evidence manifest for nondeterminism excusal
      - name: Hermetic cold build (convergence + evidence pass)
        run: HEAP=11g ./tools/build/build.sh --manifest
      - name: Hermetic build + parity judge
        run: HEAP=11g ./tools/build/build.sh --judge
      - name: Upload build log + parity debug bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-future-debug
          path: |
            build-future.log
            parity-debug.tgz
          if-no-files-found: ignore

  determinism-gate:
    name: "Determinism gate: two converged builds, byte-identical (no excusal)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The LOCAL-nondeterminism half of the determinism contract (docs/txpack-vision.md): the build's
    # own computation must be a pure function of inputs. Unlike the reproducibility job above, this
    # gate has NO evidence excusal and NO allowlist - a category-2 (accidental) difference FAILS.
    # Inherent volatility (timestamps, uuids, step timings) is normalized inside the manifest; only
    # ordering-equal differences are excused (the O: hash). Conservative trigger for now (3 builds);
    # intended to become a per-push blocking gate once the runner budget is confirmed.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.parity) ||
      (github.event_name == 'push' && contains(join(github.event.commits.*.message, ' '), '[determinism]'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-v1
      - name: Cache content-addressed tooling + pack
        uses: actions/cache@v4
        with:
          path: |
            ~/.fhir/tx-packs
            ~/.fhir/tools
          key: fhirlock-${{ hashFiles('fhir.lock', 'tools/build/kindling-wrapper.properties') }}
      - name: Fetch tooling jar (for the compare step)
        run: |
          url=$(grep '^toolUrl=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          sha=$(grep '^toolSha256=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          curl -fsSL -o tool.jar "$url"; echo "$sha  tool.jar" | sha256sum -c -
      - name: Build to convergence (discarded — first build is not yet converged)
        run: HEAP=11g ./tools/build/build.sh --manifest
      - name: Converged build A
        run: HEAP=11g ./tools/build/build.sh --manifest && cp build-future.manifest mA.manifest
      - name: Converged build B
        run: HEAP=11g ./tools/build/build.sh --manifest && cp build-future.manifest mB.manifest
      - name: Assert local determinism — hard, no allowlist, no evidence excusal
        run: |
          # category-2 (accidental nondeterminism: shared-mutable-state, iteration order) must be EMPTY.
          # `compare` with no -allowlist and no -prev fails (exit 1) on any non-ordering content diff
          # between the two converged same-commit builds. That is a determinism bug to fix at source.
          java -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild compare mA.manifest mB.manifest
      - name: Upload manifests on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: determinism-manifests, path: "m*.manifest", if-no-files-found: ignore }

  stock-baseline:
    name: "Baseline: stock toolchain, cold, remote tx.fhir.org"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stock_baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-v1
      - name: Stock cold build (publish.sh path, empty tx cache)
        run: |
          start=$(date +%s)
          ./publish.sh || true
          echo "STOCK duration=$(( $(date +%s) - start ))s"
