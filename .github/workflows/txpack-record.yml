name: "txpack refresh (nightly: record → reproduce → lock-bump PR)"

# The nightly pack-refresh pipeline, in ONE workflow: re-record the terminology answers against the
# canonical server, and — only if they genuinely changed — open a lock-bump PR.
#
# How it works (the determinism contract — see docs/txpack-vision.md in jmandel/fhir-perf):
# `SpecBuild record` runs a COLD build (NOT seeded from the pinned pack) ONLINE with recording on,
# so every question is re-asked and a server FIX is visible. The candidate is CARRY-FORWARD
# (merge([pinned, fresh]) — fresh wins on overlap; the pinned answer survives only where a transient
# server failure dropped it, so a flake never becomes a spurious "removed"). It is diffed against the
# pinned pack: unchanged → nothing to propose (the common nightly outcome). On a delta, a REPRODUCE
# step runs a second independent recording and `SpecBuild reproduce` keeps only the deltas both
# recordings agree on. So a proposal is, by construction, a real change in the server's answers.
#
# Two jobs, one run:
#   record  — cold-record → reproduce → publish the confirmed candidate pack to THIS repo's own
#             txpack-store release, and expose its url+sha as job outputs (changed/cand_url/cand_sha).
#   refresh — needs: record, runs ONLY when changed=true: canonical diff → published-output A/B →
#             AI explanation → a PR that mutates only fhir.lock. On a quiet night `record` sets
#             changed=false and this job is simply SKIPPED — no separate workflow run, no artifact.
#
# Manual `full_pin` dispatch: a separate from-scratch pinning demo — cold-record a COMPLETE pack and
# verify it builds hermetically (zero misses). Uploaded as an artifact; does not open a PR.

on:
  schedule:
    # the daily recapture: cold-record against the canonical server, propose a pack bump only if a
    # delta reproduces. Fires from the default branch (txpack-future). 09:11 UTC is off-peak for
    # tx.fhir.org; most nights this is a single cold build with no delta (no second build).
    - cron: "11 9 * * *"
  workflow_dispatch:
    inputs:
      server:
        description: "Terminology server to record against (a recording run hits it once, serially)"
        required: true
        default: "https://tx.fhir.org"
      full_pin:
        description: "Full re-pin: cold-record a COMPLETE pack against the server, verify it builds hermetically (zero misses), upload it as an artifact (the from-scratch pinning demo)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  # the nightly delta/refresh path (schedule, or a manual dispatch that is NOT a full re-pin)
  record:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.full_pin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed:  ${{ steps.propose.outputs.changed }}
      cand_url: ${{ steps.propose.outputs.cand_url }}
      cand_sha: ${{ steps.propose.outputs.cand_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-v1
      - name: Fetch tooling jar (from kindling-wrapper.properties)
        run: |
          url=$(grep '^toolUrl=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          sha=$(grep '^toolSha256=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          curl -fsSL -o tool.jar "$url"; echo "$sha  tool.jar" | sha256sum -c -
      - name: Record (build A) — cold recording against the canonical server
        run: |
          # COLD: the build is NOT seeded from the pinned pack, so every question is re-asked and a
          # server FIX is visible. The candidate is carry-forward (merge([pinned, fresh]), pinned
          # filling only what a transient failure dropped), so a flake never becomes a "removed".
          # A `candidate-A.fresh.zip` sidecar (the raw recording) is emitted only when build A sees a
          # real delta vs the pinned pack.
          SERVER="${{ inputs.server }}"; SERVER="${SERVER:-https://tx.fhir.org}"
          printf '{ "txFhirProduction": "%s" }\n' "$SERVER" > /tmp/record-settings.json
          java -Xmx11g -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild record . \
            -fhir-settings /tmp/record-settings.json -out candidate-A
          mv -f record.log record-A.log 2>/dev/null || true
      - name: Reproduce-before-propose — a second recording confirms the delta
        run: |
          # No sidecar => no delta => nothing to confirm (the common nightly outcome, one build).
          if [ ! -f candidate-A.fresh.zip ]; then
            echo "no delta — the pinned pack still matches the server; nothing to propose."
            exit 0
          fi
          # An INDEPENDENT second recording. A real server change reproduces; a load-induced flap
          # does not, and `reproduce` drops it (carrying the pinned answer forward). Run as a separate
          # JVM — the Publisher is not re-entrant in-process.
          SERVER="${{ inputs.server }}"; SERVER="${SERVER:-https://tx.fhir.org}"
          printf '{ "txFhirProduction": "%s" }\n' "$SERVER" > /tmp/record-settings.json
          java -Xmx11g -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild record . \
            -fhir-settings /tmp/record-settings.json -out candidate-B
          mv -f record.log record-B.log 2>/dev/null || true
          java -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild reproduce \
            -fresh candidate-A.fresh.zip -confirm candidate-B.fresh.zip \
            -pinned fhir.lock -out candidate-pack
      - name: Propose, if a change survived confirmation
        id: propose
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f candidate-pack.zip ]; then
            # No candidate survived. Two distinct, both-fine reasons (the record + reproduce steps
            # above say which): the cold recording was canonically identical to the pinned pack (the
            # common quiet night), OR a delta did not reproduce in the second recording (server flake,
            # correctly dropped). Either way there is nothing to propose - this is success, not failure.
            echo "nothing to propose: the pinned pack still matches the server (no delta), or a delta did not reproduce. See the record/reproduce steps above for which."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(sha256sum candidate-pack.zip | cut -d' ' -f1)
          name="txpack-${sha:0:8}.zip"
          cp candidate-pack.zip "$name"
          # Publish the immutable, hash-named pack to THIS repo's own store release (default
          # GITHUB_TOKEN, same repo — no cross-repo token). Reads stay public curl, so consumers
          # need nothing. The store release is created on demand if it doesn't exist yet.
          gh release view txpack-store --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create txpack-store --repo "$GITHUB_REPOSITORY" --title "txpack answer-pack store" --notes "Content-addressed terminology answer packs, published by this repo's own recorder."
          gh release upload txpack-store "$name" --repo "$GITHUB_REPOSITORY" --clobber
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/txpack-store/$name"
          # Hand the candidate to the refresh job (below) via job OUTPUTS — same workflow run, no
          # artifact, no cross-workflow trigger.
          echo "changed=true"   >> "$GITHUB_OUTPUT"
          echo "cand_url=$url"   >> "$GITHUB_OUTPUT"
          echo "cand_sha=$sha"   >> "$GITHUB_OUTPUT"
          echo "proposed $name (sha256 $sha) -> the refresh job will diff it, measure impact, and open the PR"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: record-logs, path: "record-*.log", if-no-files-found: ignore }

  # the downstream half, now a DEPENDENT job: runs only when `record` confirmed a real, reproduced
  # change. On a quiet night `record.outputs.changed` is "false" and this whole job is SKIPPED — no
  # separate workflow run, no artifact hand-off; the candidate url+sha arrive as job outputs.
  refresh:
    needs: record
    if: needs.record.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the current + candidate packs (urls/shas from the record job)
        run: |
          cand_url='${{ needs.record.outputs.cand_url }}'
          cand_sha='${{ needs.record.outputs.cand_sha }}'
          cur_url=$(jq -r '.packages[] | select(.contentSha256) | .resolved' fhir.lock)
          cur_int=$(jq -r '.packages[] | select(.contentSha256) | .integrity' fhir.lock)
          cur_sha=$(echo "$cur_int" | sed 's/^sha256-//' | base64 -d | xxd -p -c64)
          curl -fsSL -o current.zip "$cur_url";    echo "$cur_sha  current.zip"   | sha256sum -c -
          curl -fsSL -o candidate.zip "$cand_url"; echo "$cand_sha  candidate.zip" | sha256sum -c -
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Fetch tooling jar (from kindling-wrapper.properties)
        run: |
          url=$(grep '^toolUrl=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          sha=$(grep '^toolSha256=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          curl -fsSL -o tool.jar "$url"; echo "$sha  tool.jar" | sha256sum -c -
      - name: Canonical compare (Java packager diff)
        id: diff
        run: |
          set +e
          java -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild diff-packs current.zip candidate.zip > pack-diff.md
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "No semantic change - keeping the current pack; nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 3 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            exit $rc
          fi
          cat pack-diff.md
      # layer 1: what does this bump actually do to the published spec? Same-machine A/B:
      # build with the current pack, build with the candidate, diff content-level output.
      # Hermetic both times - a candidate that DROPS needed answers fails loudly right here.
      - name: Cache FHIR package cache
        if: steps.diff.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-v1
      - name: Output A/B (current pack, then candidate)
        if: steps.diff.outputs.changed == 'true'
        run: |
          java -Xmx11g -Dorg.hl7.fhir.tx.pack="$PWD/current.zip" -cp tool.jar \
            org.hl7.fhir.tools.publisher.SpecBuild build . --manifest
          cp build-future.manifest /tmp/old-output.manifest
          rm -f build-future.manifest
          SIGNATURE_GATE=report java -Xmx11g -Dorg.hl7.fhir.tx.pack="$PWD/candidate.zip" -cp tool.jar \
            org.hl7.fhir.tools.publisher.SpecBuild build . --manifest
          CAND_SIG=$(grep -E "Summary: Errors=" build-future.log | tail -1 | sed 's/.*Summary: //')
          CUR_SIG=$(jq -r '.expectedOutput | "Errors=\(.errors), Warnings=\(.warnings), Information messages=\(.information)"' fhir.lock)
          { echo "## Published-output impact (same-machine A/B, content-level)";
            echo;
            echo "**Output signature with candidate: $CAND_SIG** (current pack: $CUR_SIG)";
            echo;
            java -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild impact /tmp/old-output.manifest build-future.manifest | sed 's/^/- /' > /tmp/impact-list.txt
            n=$(wc -l < /tmp/impact-list.txt)
            if [ "$n" -eq 0 ]; then echo "**No published file changes** - this bump is output-inert."; else
              echo "**$n published file(s) change with this bump:**"; echo; cat /tmp/impact-list.txt; fi; } > output-impact.md
          cat output-impact.md
      - name: "Explanation section (GitHub Models - narrative only, no tools, no authority)"
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat pack-diff.md output-impact.md > /tmp/explain-input.md 2>/dev/null || cp pack-diff.md /tmp/explain-input.md
          jq -n --rawfile diff /tmp/explain-input.md '{
            model: "openai/gpt-4o-mini",
            messages: [
              {role: "system", content: "You explain terminology answer-pack diffs for FHIR spec build reviewers. Use ONLY facts present in the supplied diff. Group related changes, state the likely kind of cause (new spec content vs server-side curation), and say plainly what a reviewer should look at. 3 short paragraphs max. Do not invent counts or claims."},
              {role: "user", content: $diff}
            ]
          }' > req.json
          curl -fsS https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d @req.json | jq -r '.choices[0].message.content' > explanation.md \
            || echo "_(explanation service unavailable; machine diff above is authoritative)_" > explanation.md
      - name: Open lock-bump PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssri="sha256-$(echo '${{ needs.record.outputs.cand_sha }}' | xxd -r -p | base64)"
          name=$(jq -r '.packages | to_entries[] | select(.key | endswith(".txpack")) | .key' fhir.lock)
          jq --arg n "$name" --arg url '${{ needs.record.outputs.cand_url }}' --arg int "$ssri" \
             '.packages[$n].resolved=$url | .packages[$n].integrity=$int' fhir.lock > fhir.lock.new && mv fhir.lock.new fhir.lock
          branch="txpack-bump-$(date +%Y%m%d-%H%M)"
          git checkout -b "$branch"
          git -c user.name=txpack-refresh -c user.email=noreply@github.com commit -am "Bump fhir.lock to candidate pack"
          git push origin "$branch"
          { echo "Machine-verified canonical diff (authoritative):"; echo; cat pack-diff.md; echo;
            cat output-impact.md 2>/dev/null || true; echo;
            echo "## Explanation (AI-generated from the diffs above - narrative only)"; echo; cat explanation.md; } > body.md
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "txpack refresh: $(grep -m1 'changed' pack-diff.md || echo 'answer updates')" \
            --body-file body.md

  # the from-scratch pinning demonstration (manual `full_pin` dispatch only): cold-record a COMPLETE
  # pack against the public server, verify it builds the spec hermetically with zero misses, and
  # upload it as an artifact for review + promotion to the pack release channel.
  full-pin:
    if: github.event_name == 'workflow_dispatch' && inputs.full_pin
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Cache FHIR package cache
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ runner.os }}-v1
      - name: Fetch tooling jar (from kindling-wrapper.properties)
        run: |
          url=$(grep '^toolUrl=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          sha=$(grep '^toolSha256=' tools/build/kindling-wrapper.properties | cut -d= -f2-)
          curl -fsSL -o tool.jar "$url"; echo "$sha  tool.jar" | sha256sum -c -
      - name: Cold serial record of a COMPLETE pack against the public server
        run: |
          # record() is cold + serial by design: it re-asks the build's full question set against the
          # live server (serial keeps load-induced shedding under the retry cap so the capture is
          # complete) and writes the RAW fresh recording — zero carry-forward — to candidate.fresh.zip.
          SERVER="${{ inputs.server }}"; SERVER="${SERVER:-https://tx.fhir.org}"
          printf '{ "txFhirProduction": "%s" }\n' "$SERVER" > /tmp/record-settings.json
          # -bootstrap: ignore any existing pin entirely (no carry-forward, no diff). The recorder's
          # job is to CREATE the pin, so the from-scratch demo must not depend on a prior one.
          java -Xmx11g -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild record . \
            -bootstrap -fhir-settings /tmp/record-settings.json -out candidate
      - name: Select the pure-fresh pack (zero carry-forward), name it by content hash
        id: pack
        run: |
          if   [ -f candidate.fresh.zip ]; then PACK=candidate.fresh.zip   # the raw fresh recording
          elif [ -f candidate.zip ];       then PACK=candidate.zip         # fresh == pinned: carry-forward is a no-op
          else echo "::error::record produced no pack — the server was unreachable"; exit 1; fi
          sha=$(sha256sum "$PACK" | cut -d' ' -f1)
          out="txpack-${sha:0:8}.zip"; cp "$PACK" "$out"
          echo "pack=$out" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"  >> "$GITHUB_OUTPUT"
          echo "selected $out (sha256 $sha)"
      - name: Verify PERFECT — hermetic build off the new pack (any miss is a hard failure)
        env:
          SIGNATURE_GATE: report   # a from-scratch pin sets a NEW signature; don't gate on the old one
        run: |
          # an explicit -Dorg.hl7.fhir.tx.pack WINS over fhir.lock (Publisher.java); --hermetic turns
          # ANY unanswered terminology question into a hard TxHermeticViolationError. So rc=0 proves
          # the pack served every question with ZERO terminology network — a complete, perfect pack.
          java -Xmx11g -Dorg.hl7.fhir.tx.pack="$PWD/${{ steps.pack.outputs.pack }}" \
            -cp tool.jar org.hl7.fhir.tools.publisher.SpecBuild build . --hermetic
          sig=$(grep -E '^Summary: Errors=' build-future.log | tail -1)
          echo "captured output signature: $sig"
          e=$(echo "$sig" | sed -E 's/.*Errors=([0-9]+).*/\1/')
          w=$(echo "$sig" | sed -E 's/.*Warnings=([0-9]+).*/\1/')
          i=$(echo "$sig" | sed -E 's/.*Information messages=([0-9]+).*/\1/')
          ssri="sha256-$(python3 -c "import base64;print(base64.b64encode(bytes.fromhex('${{ steps.pack.outputs.sha }}')).decode())")"
          jq -n --arg pack "${{ steps.pack.outputs.pack }}" --arg sha "${{ steps.pack.outputs.sha }}" \
                --arg ssri "$ssri" --argjson e "$e" --argjson w "$w" --argjson i "$i" \
                --arg server "${{ inputs.server }}" --arg date "$(date -u +%Y-%m-%d)" \
            '{pack:$pack, sha256:$sha, integrity:$ssri, expectedOutput:{errors:$e,warnings:$w,information:$i}, recordedAgainst:($server+" "+$date)}' \
            | tee pin-proposal.json
      - name: Upload the verified pack + proposed pin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: txpack-full-pin
          path: |
            txpack-*.zip
            pin-proposal.json
            build-future.log
            record.log
          if-no-files-found: warn
